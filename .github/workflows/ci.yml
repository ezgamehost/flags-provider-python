name: CI

# check: ruff, mypy --strict, pytest (with flags-stack's conformance vectors, vendored in
# tests/vectors) and the wheel and sdist build, on Python 3.12 and 3.13.
# vectors: the vendored vectors match flags-stack's protocol/vectors/eval at .flags-stack-rev.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: build the wheel and sdist; the wheel holds only ezgh_flags
        run: |
          uv build
          uv run python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); bad=[p for p in n if not p.startswith('ezgh_flags')]; assert not bad, bad"

  # flags-stack is internal: the job reads it with the FLAGS_STACK_DEPLOY_KEY secret (a read-only
  # deploy key on flags-stack), and fails on a push to main when the secret is missing (so a
  # deleted key can't turn main silently green). Pull requests without it (forks get no secrets)
  # skip with a notice.
  vectors:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.FLAGS_STACK_DEPLOY_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error title=vectors can't run::FLAGS_STACK_DEPLOY_KEY isn't set, so this job can't read ezgamehost/flags-stack. On main that's a failure, not a skip: restore the deploy key."; exit 1
          else echo "::notice title=vectors skipped::FLAGS_STACK_DEPLOY_KEY isn't available to this pull request; the vectors weren't compared."; fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        id: rev
        run: echo "sha=$(cat .flags-stack-rev)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: ezgamehost/flags-stack
          ref: ${{ steps.rev.outputs.sha }}
          ssh-key: ${{ secrets.FLAGS_STACK_DEPLOY_KEY }}
          path: .flags-stack
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        name: vendored vectors match flags-stack
        run: diff -r --exclude SOURCE .flags-stack/protocol/vectors/eval tests/vectors
